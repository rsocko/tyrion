services:
  tyrion-monarch-bridge:
    image: ${TYRION_BRIDGE_IMAGE:-ghcr.io/rsocko/tyrion-bridge}:${TYRION_IMAGE_TAG:-latest}
    container_name: tyrion-monarch-bridge
    restart: unless-stopped
    init: true
    read_only: true
    cpus: "${TYRION_BRIDGE_CPUS:-1.0}"
    mem_limit: "${TYRION_BRIDGE_MEMORY:-512m}"
    memswap_limit: "${TYRION_BRIDGE_MEMORY:-512m}"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      - tyrion-backend
    volumes:
      - tyrion-session:/var/lib/tyrion
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8100"
      BRIDGE_ALLOWED_ORIGINS: ${BRIDGE_ALLOWED_ORIGINS:?Set BRIDGE_ALLOWED_ORIGINS}
      BRIDGE_REMOTE_TLS: "true"
      BRIDGE_LOAD_DOTENV: "false"
      DEFAULT_TRANSACTION_DAYS: "${DEFAULT_TRANSACTION_DAYS:-90}"
      SESSION_FILE: /var/lib/tyrion/monarch-session.json
      BRIDGE_API_TOKEN: ${BRIDGE_API_TOKEN:?Provision BRIDGE_API_TOKEN as a secret}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  tyrion-operations-ui:
    image: ${TYRION_UI_IMAGE:-ghcr.io/rsocko/tyrion-ui}:${TYRION_IMAGE_TAG:-latest}
    container_name: tyrion-operations-ui
    restart: unless-stopped
    init: true
    read_only: true
    cpus: "${TYRION_UI_CPUS:-0.5}"
    mem_limit: "${TYRION_UI_MEMORY:-256m}"
    memswap_limit: "${TYRION_UI_MEMORY:-256m}"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      tyrion-monarch-bridge:
        condition: service_healthy
    networks:
      - tyrion-backend
      - traefik
    volumes:
      - tyrion-policy:/var/lib/tyrion-policy
      - tyrion-finance-insights:/var/lib/tyrion-finance-insights
    environment:
      BRIDGE_URL: http://tyrion-monarch-bridge:8100
      BRIDGE_API_TOKEN: ${BRIDGE_API_TOKEN:?Provision BRIDGE_API_TOKEN as a secret}
      TYRION_POLICY_STORE_PATH: /var/lib/tyrion-policy/policies.json
      TYRION_REATTRIBUTION_URL: ${TYRION_REATTRIBUTION_URL:-}
      TYRION_REATTRIBUTION_TOKEN: ${TYRION_REATTRIBUTION_TOKEN:-}
      TYRION_REATTRIBUTION_ALLOW_INSECURE_INTERNAL: "false"
      TYRION_POLICY_DEMO_MODE: "false"
      TYRION_FINANCE_INSIGHT_STORE_PATH: /var/lib/tyrion-finance-insights/state.sqlite
      TYRION_FINANCE_INSIGHT_POLICY_PATH: /var/lib/tyrion-finance-insights/policy.json
      TYRION_FINANCE_INSIGHT_CURSOR_KEY: ${TYRION_FINANCE_INSIGHT_CURSOR_KEY:?Provision the finance insight cursor key as a secret}
      TYRION_FINANCE_INSIGHT_IDENTITY_KEY: ${TYRION_FINANCE_INSIGHT_IDENTITY_KEY:?Provision the finance insight identity key as a secret}
      TYRION_FINANCE_INSIGHT_EVALUATION_WRITE_ENABLED: "${TYRION_FINANCE_INSIGHT_EVALUATION_WRITE_ENABLED:-false}"
      TYRION_FINANCE_INSIGHT_READ_ENABLED: "${TYRION_FINANCE_INSIGHT_READ_ENABLED:-false}"
      TYRION_FINANCE_INSIGHT_ACTIONS_ENABLED: "${TYRION_FINANCE_INSIGHT_ACTIONS_ENABLED:-false}"
      NEXT_TELEMETRY_DISABLED: "1"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tyrion.rule=Host(`${TYRION_HOSTNAME:-tyrion.socko.us}`) && !PathPrefix(`/api/internal/`) && !PathPrefix(`/api/connector/v1/`)"
      - "traefik.http.routers.tyrion.entrypoints=web"
      - "traefik.http.routers.tyrion.middlewares=trusted-private-networks@file,https-redirect@file"
      - "traefik.http.routers.tyrion.priority=100"
      - "traefik.http.routers.tyrion-secure.rule=Host(`${TYRION_HOSTNAME:-tyrion.socko.us}`) && !PathPrefix(`/api/internal/`) && !PathPrefix(`/api/connector/v1/`)"
      - "traefik.http.routers.tyrion-secure.entrypoints=websecure"
      - "traefik.http.routers.tyrion-secure.tls=true"
      - "traefik.http.routers.tyrion-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tyrion-secure.middlewares=trusted-private-networks@file,compression@file,security-headers@file"
      - "traefik.http.routers.tyrion-secure.priority=100"
      - "traefik.http.routers.tyrion-connector.rule=Host(`${TYRION_HOSTNAME:-tyrion.socko.us}`) && (Path(`/api/connector/v1/contract`) || Path(`/api/connector/v1/health`) || Path(`/api/connector/v1/transactions`) || Path(`/api/connector/v1/accounts`) || Path(`/api/connector/v1/category-groups`) || Path(`/api/connector/v1/categories`) || Path(`/api/connector/v1/tags`) || Path(`/api/connector/v1/recurring`) || Path(`/api/connector/v1/budgets`) || Path(`/api/connector/v1/sync`) || PathRegexp(`^/api/connector/v1/transactions/[^/]+$$`) || PathRegexp(`^/api/connector/v1/transactions/[^/]+/(splits|category)$$`))"
      - "traefik.http.routers.tyrion-connector.entrypoints=web"
      - "traefik.http.routers.tyrion-connector.middlewares=tyrion-public-connector-marker,https-redirect@file"
      - "traefik.http.routers.tyrion-connector.priority=200"
      - "traefik.http.routers.tyrion-connector-secure.rule=Host(`${TYRION_HOSTNAME:-tyrion.socko.us}`) && (Path(`/api/connector/v1/contract`) || Path(`/api/connector/v1/health`) || Path(`/api/connector/v1/transactions`) || Path(`/api/connector/v1/accounts`) || Path(`/api/connector/v1/category-groups`) || Path(`/api/connector/v1/categories`) || Path(`/api/connector/v1/tags`) || Path(`/api/connector/v1/recurring`) || Path(`/api/connector/v1/budgets`) || Path(`/api/connector/v1/sync`) || PathRegexp(`^/api/connector/v1/transactions/[^/]+$$`) || PathRegexp(`^/api/connector/v1/transactions/[^/]+/(splits|category)$$`))"
      - "traefik.http.routers.tyrion-connector-secure.entrypoints=websecure"
      - "traefik.http.routers.tyrion-connector-secure.tls=true"
      - "traefik.http.routers.tyrion-connector-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tyrion-connector-secure.middlewares=tyrion-public-connector-marker,compression@file,security-headers@file"
      - "traefik.http.routers.tyrion-connector-secure.priority=200"
      - "traefik.http.middlewares.tyrion-public-connector-marker.headers.customrequestheaders.X-Tyrion-Public-Connector=1"
      - "traefik.http.services.tyrion.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  tyrion-session:
    name: ${TYRION_SESSION_VOLUME:-tyrion-session}
  tyrion-policy:
    name: ${TYRION_POLICY_VOLUME:-tyrion-policy}
  tyrion-finance-insights:
    name: ${TYRION_FINANCE_INSIGHT_VOLUME:-tyrion-finance-insights}

networks:
  tyrion-backend:
    name: ${TYRION_BACKEND_NETWORK:-tyrion-backend}
  traefik:
    external: true
