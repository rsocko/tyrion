services:
  tyrion-monarch-bridge:
    image: registry.socko.us/tyrion-bridge:${TYRION_BRIDGE_IMAGE_TAG:-latest}
    container_name: tyrion-monarch-bridge
    restart: unless-stopped
    init: true
    read_only: true
    cpus: "${TYRION_BRIDGE_CPUS:-1.0}"
    mem_limit: "${TYRION_BRIDGE_MEMORY:-512m}"
    memswap_limit: "${TYRION_BRIDGE_MEMORY:-512m}"
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    networks:
      - tyrion-backend
    volumes:
      - tyrion-session:/var/lib/tyrion
    environment:
      BRIDGE_HOST: 0.0.0.0
      BRIDGE_PORT: "8100"
      BRIDGE_ALLOWED_ORIGINS: ${BRIDGE_ALLOWED_ORIGINS:-https://mc.socko.us}
      BRIDGE_REMOTE_TLS: "true"
      BRIDGE_LOAD_DOTENV: "false"
      DEFAULT_TRANSACTION_DAYS: "${DEFAULT_TRANSACTION_DAYS:-90}"
      SESSION_FILE: /var/lib/tyrion/monarch-session.json
      BRIDGE_API_TOKEN: ${BRIDGE_API_TOKEN:?Provision BRIDGE_API_TOKEN as a Dockhand secret}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  tyrion-operations-ui:
    image: registry.socko.us/tyrion-ui:${TYRION_UI_IMAGE_TAG:-latest}
    container_name: tyrion-operations-ui
    restart: unless-stopped
    init: true
    read_only: true
    cpus: "${TYRION_UI_CPUS:-0.5}"
    mem_limit: "${TYRION_UI_MEMORY:-256m}"
    memswap_limit: "${TYRION_UI_MEMORY:-256m}"
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m
      - /app/.next/cache:rw,noexec,nosuid,nodev,size=32m
    depends_on:
      tyrion-monarch-bridge:
        condition: service_healthy
    networks:
      - tyrion-backend
      - traefik
    volumes:
      - tyrion-policy:/var/lib/tyrion-policy
    environment:
      BRIDGE_URL: http://tyrion-monarch-bridge:8100
      BRIDGE_API_TOKEN: ${BRIDGE_API_TOKEN:?Provision BRIDGE_API_TOKEN as a Dockhand secret}
      TYRION_POLICY_STORE_PATH: /var/lib/tyrion-policy/policies.json
      TYRION_POLICY_AUTH_SECRET: ${TYRION_POLICY_AUTH_SECRET:?Provision TYRION_POLICY_AUTH_SECRET as a Dockhand secret}
      TYRION_INSTRUMENT_FINGERPRINT_KEY: ${TYRION_INSTRUMENT_FINGERPRINT_KEY:?Provision TYRION_INSTRUMENT_FINGERPRINT_KEY as a Dockhand secret}
      TYRION_REATTRIBUTION_URL: ${TYRION_REATTRIBUTION_URL:-}
      TYRION_REATTRIBUTION_TOKEN: ${TYRION_REATTRIBUTION_TOKEN:-}
      TYRION_REATTRIBUTION_ALLOW_INSECURE_INTERNAL: "false"
      TYRION_POLICY_DEMO_MODE: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tyrion.rule=Host(`${TYRION_HOSTNAME:-tyrion.socko.us}`)"
      - "traefik.http.routers.tyrion.entrypoints=web"
      - "traefik.http.routers.tyrion.middlewares=trusted-private-networks@file,https-redirect@file"
      - "traefik.http.routers.tyrion-secure.rule=Host(`${TYRION_HOSTNAME:-tyrion.socko.us}`)"
      - "traefik.http.routers.tyrion-secure.entrypoints=websecure"
      - "traefik.http.routers.tyrion-secure.tls=true"
      - "traefik.http.routers.tyrion-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tyrion-secure.middlewares=trusted-private-networks@file,compression@file,security-headers@file"
      - "traefik.http.routers.tyrion-policy.rule=Host(`${TYRION_HOSTNAME:-tyrion.socko.us}`) && PathPrefix(`/api/policy`)"
      - "traefik.http.routers.tyrion-policy.entrypoints=websecure"
      - "traefik.http.routers.tyrion-policy.tls=true"
      - "traefik.http.routers.tyrion-policy.tls.certresolver=letsencrypt"
      - "traefik.http.routers.tyrion-policy.priority=100"
      - "traefik.http.routers.tyrion-policy.middlewares=trusted-private-networks@file,tyrion-policy-auth,compression@file,security-headers@file"
      - "traefik.http.routers.tyrion-policy.service=tyrion"
      - "traefik.http.middlewares.tyrion-policy-auth.forwardauth.address=${TYRION_POLICY_AUTH_URL:?Provision TYRION_POLICY_AUTH_URL for signed policy assertions}"
      - "traefik.http.middlewares.tyrion-policy-auth.forwardauth.trustForwardHeader=false"
      - "traefik.http.middlewares.tyrion-policy-auth.forwardauth.authResponseHeaders=X-Tyrion-Actor,X-Tyrion-Household,X-Tyrion-Permissions,X-Tyrion-Auth-Timestamp,X-Tyrion-Auth-Signature"
      - "traefik.http.services.tyrion.loadbalancer.server.port=3000"
      - "traefik.docker.network=traefik"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  tyrion-session:
    name: ${TYRION_SESSION_VOLUME:-tyrion-session}
  tyrion-policy:
    name: ${TYRION_POLICY_VOLUME:-tyrion-policy}

networks:
  tyrion-backend:
    name: ${TYRION_BACKEND_NETWORK:-tyrion-backend}
  traefik:
    external: true
