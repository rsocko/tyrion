name: Publish bridge image

on:
  workflow_run:
    workflows: ["Bridge container CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-tyrion
  queue: max
  cancel-in-progress: false

env:
  REGISTRY_REPOSITORY: registry.socko.us/tyrion

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: [self-hosted, linux, docker, build, homelab, dockhand]
    timeout-minutes: 30
    steps:
      - name: Checkout trusted revision
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tags
        id: image
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Source revision is not a lowercase 40-character commit SHA" >&2
            exit 1
          fi
          {
            echo 'tags<<EOF'
            echo "${REGISTRY_REPOSITORY}:sha-${SOURCE_SHA}"
            if [ "${GITHUB_EVENT_NAME}" = "workflow_run" ] || [ "${GITHUB_REF}" = "refs/heads/main" ]; then
              echo "${REGISTRY_REPOSITORY}:main"
              echo "${REGISTRY_REPOSITORY}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Refuse immutable tag overwrite
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          status="$(
            curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
              --head \
              --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://registry.socko.us/v2/tyrion/manifests/sha-${SOURCE_SHA}"
          )"
          case "$status" in
            404) ;;
            200)
              echo "Immutable image tag already exists; refusing to overwrite it" >&2
              exit 1
              ;;
            *)
              echo "Registry returned HTTP $status while checking the immutable tag" >&2
              exit 1
              ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The established private-runner convention does not inject registry credentials.
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: monarch-bridge
          file: monarch-bridge/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.tags }}
          provenance: false

      - name: Publish image summary
        shell: bash
        run: |
          {
            echo '## Tyrion bridge image'
            echo
            echo 'Published tags:'
            while IFS= read -r tag; do
              echo "- \`$tag\`"
            done <<< "${{ steps.image.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
