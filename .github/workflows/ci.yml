name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            monarch-bridge/requirements.txt
            monarch-bridge/requirements-runtime.txt

      - name: Install test dependencies
        working-directory: monarch-bridge
        run: python -m pip install -r requirements.txt

      - name: Test bridge and packaging contracts
        working-directory: monarch-bridge
        run: python -m pytest test_auth.py test_bridge.py test_container.py

      - name: Check bridge Python syntax
        run: python -m compileall -q monarch-bridge

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            kid-engine/package-lock.json
            triage-app/package-lock.json

      - name: Install Tyrion domain dependencies
        working-directory: kid-engine
        run: npm ci --no-audit --no-fund

      - name: Test Tyrion domain contracts
        working-directory: kid-engine
        run: npm test

      - name: Verify published Tyrion package surface
        working-directory: kid-engine
        run: npm run test:consumer

      - name: Install UI dependencies
        working-directory: triage-app
        run: npm ci --no-audit --no-fund

      - name: Build operational UI
        working-directory: triage-app
        run: npm run build

      - name: Test operational UI boundary and proxy
        working-directory: triage-app
        run: npm test

      - name: Build production images without publishing
        run: |
          docker build --tag tyrion-bridge:ci .
          docker build --tag tyrion-ui:ci triage-app
