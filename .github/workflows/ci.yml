name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: monarch-bridge
        run: python -m pip install -r requirements.txt

      - name: Test bridge and packaging contracts
        working-directory: monarch-bridge
        run: python -m pytest test_auth.py test_bridge.py test_container.py

      - name: Check bridge Python syntax
        run: python -m compileall -q monarch-bridge

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install Tyrion domain dependencies
        working-directory: kid-engine
        run: npm ci --no-audit --no-fund

      - name: Test and build Tyrion domain contracts
        working-directory: kid-engine
        run: |
          npm test
          npm run build

      - name: Install UI dependencies
        working-directory: triage-app
        run: npm ci --no-audit --no-fund

      - name: Build operational UI
        working-directory: triage-app
        run: npm run build

      - name: Test operational UI boundary and proxy
        working-directory: triage-app
        run: npm test

      - name: Build production images without publishing
        run: |
          docker build --tag tyrion-bridge:ci .
          docker build --file triage-app/Dockerfile --tag tyrion-ui:ci .
