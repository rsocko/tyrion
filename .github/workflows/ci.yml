name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependencies
        working-directory: monarch-bridge
        run: >-
          python -m pip install
          --index-url https://pypi.org/simple
          --require-hashes
          -r requirements.txt

      - name: Verify installed Python dependency graph
        run: python .github/scripts/check_python_dependency_policy.py --installed

      - name: Test bridge and packaging contracts
        working-directory: monarch-bridge
        run: python -m pytest test_auth.py test_bridge.py test_container.py

      - name: Check bridge Python syntax
        run: python -m compileall -q monarch-bridge

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Tyrion domain dependencies
        working-directory: kid-engine
        run: npm ci --no-audit --no-fund

      - name: Test and build Tyrion domain contracts
        working-directory: kid-engine
        run: |
          npm test
          npm run build

      - name: Validate public UI lock portability
        run: python .github/scripts/check_npm_lock_policy.py

      - name: Cold-install UI dependencies from committed public lock
        working-directory: triage-app
        run: npm ci --no-audit --no-fund

      - name: Lint and type-check operational UI
        working-directory: triage-app
        run: |
          npm run lint
          npm run typecheck

      - name: Build operational UI with Turbopack
        working-directory: triage-app
        run: npm run build

      - name: Test operational UI boundary and proxy
        working-directory: triage-app
        run: npm test

      - name: Build production images without publishing
        run: |
          docker build --tag tyrion-bridge:ci .
          docker build --file triage-app/Dockerfile --tag tyrion-ui:ci .

      - name: Enforce operational UI advisory policy
        working-directory: triage-app
        run: npm audit --audit-level=high
