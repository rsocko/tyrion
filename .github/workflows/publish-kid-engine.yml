name: Publish kid engine

on:
  push:
    tags:
      - "kid-engine-v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-kid-engine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify release tag and main ancestry
        shell: bash
        run: |
          version="$(node -p "require('./kid-engine/package.json').version")"
          test "${GITHUB_REF_NAME}" = "kid-engine-v${version}"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: kid-engine/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@rsocko"

      - name: Install dependencies
        working-directory: kid-engine
        run: npm ci --no-audit --no-fund

      - name: Test package
        working-directory: kid-engine
        run: |
          npm test
          npm run test:consumer

      - name: Publish exact version
        working-directory: kid-engine
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
