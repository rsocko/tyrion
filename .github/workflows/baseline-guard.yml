name: Baseline guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conflicts-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Enforce workflow trust boundaries
        run: |
          python .github/scripts/check_workflow_security.py
          python .github/scripts/test_workflow_security.py
          python .github/scripts/test_publish_images.py
      - name: Enforce Actions artifact policy
        run: python .github/scripts/check_actions_artifact_policy.py
      - name: Enforce license and asset policy
        run: |
          python .github/scripts/check_license_policy.py
          python .github/scripts/check_npm_lock_policy.py
          python .github/scripts/test_npm_lock_policy.py
      - name: Enforce Python dependency policy
        run: |
          python .github/scripts/check_python_dependency_policy.py
          python .github/scripts/test_python_dependency_policy.py
      - name: Reject unresolved conflicts
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- .; then
            echo "Unresolved conflict markers found."
            exit 1
          fi
      - name: Check bridge Python syntax
        run: python -m compileall -q monarch-bridge
