name: Baseline guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conflicts-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Enforce workflow trust boundaries
        run: |
          python .github/scripts/check_workflow_security.py
          python .github/scripts/test_workflow_security.py
      - name: Enforce Actions artifact policy
        run: python .github/scripts/check_actions_artifact_policy.py
      - name: Enforce license and asset policy
        run: python .github/scripts/check_license_policy.py
      - name: Reject unresolved conflicts
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- .; then
            echo "Unresolved conflict markers found."
            exit 1
          fi
      - name: Check bridge Python syntax
        run: python -m compileall -q monarch-bridge
