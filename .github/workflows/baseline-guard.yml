name: Baseline guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conflicts-and-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject unresolved conflicts
        shell: bash
        run: |
          if git grep -nE '^(<<<<<<< .+|=======|>>>>>>> .+)$' -- .; then
            echo "Unresolved conflict markers found."
            exit 1
          fi
      - name: Check bridge Python syntax
        run: python -m compileall -q monarch-bridge
