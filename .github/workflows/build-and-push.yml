name: Build and Push Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-and-push-tyrion
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref_name == github.event.repository.default_branch) ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, linux, docker, build, homelab, dockhand]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: bridge
            context: .
            file: Dockerfile
            repository: registry.socko.us/tyrion-bridge
          - component: operations-ui
            context: .
            file: triage-app/Dockerfile
            repository: registry.socko.us/tyrion-ui
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve immutable image tag
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_SHA="$(git rev-parse HEAD)"
          echo "sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved image: ${{ matrix.repository }}:sha-$IMAGE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Preserve existing immutable image
        id: immutable
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ matrix.repository }}:${{ steps.image.outputs.tag }}"
          if INSPECT_ERROR="$(docker buildx imagetools inspect "$IMAGE" 2>&1)"; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Immutable image already exists; it will not be overwritten."
          elif printf '%s' "$INSPECT_ERROR" | grep -Eqi 'manifest unknown|not found'; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to verify immutable image availability." >&2
            exit 1
          fi

      - name: Build and push image
        if: steps.immutable.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ matrix.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=registry,ref=${{ matrix.repository }}:buildcache
          cache-to: type=registry,ref=${{ matrix.repository }}:buildcache,mode=max

      - name: Publish immutable image summary
        shell: bash
        run: |
          {
            echo "## Tyrion ${{ matrix.component }} image"
            echo
            echo "Immutable image: \`${{ matrix.repository }}:${{ steps.image.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: build
    runs-on: [self-hosted, linux, docker, build, homelab, dockhand]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Check whether images are current main
        id: current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IMAGE_SHA="$(git rev-parse HEAD)"
          echo "sha=$IMAGE_SHA" >> "$GITHUB_OUTPUT"
          BASIC_AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          CURRENT_MAIN="$(git -c http.extraheader="Authorization: Basic $BASIC_AUTH" ls-remote origin "refs/heads/${{ github.event.repository.default_branch }}" | cut -f1)"
          if [ "$CURRENT_MAIN" = "$IMAGE_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer main commit exists; preserving its moving tags."
          fi

      - name: Verify both immutable images
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect \
            "registry.socko.us/tyrion-bridge:sha-${{ steps.current.outputs.sha }}" >/dev/null
          docker buildx imagetools inspect \
            "registry.socko.us/tyrion-ui:sha-${{ steps.current.outputs.sha }}" >/dev/null

      - name: Update both moving tag sets
        if: steps.current.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "registry.socko.us/tyrion-bridge:main" \
            --tag "registry.socko.us/tyrion-bridge:latest" \
            "registry.socko.us/tyrion-bridge:sha-${{ steps.current.outputs.sha }}"
          docker buildx imagetools create \
            --tag "registry.socko.us/tyrion-ui:main" \
            --tag "registry.socko.us/tyrion-ui:latest" \
            "registry.socko.us/tyrion-ui:sha-${{ steps.current.outputs.sha }}"

      - name: Publish moving tag summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Tyrion moving tags"
            echo
            if [ "${{ steps.current.outputs.publish }}" = "true" ]; then
              echo "Updated bridge and UI \`main\` and \`latest\` tags from the same commit."
            else
              echo "Skipped moving tags because a newer main commit exists."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
